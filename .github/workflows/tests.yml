name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install simba
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,simcodes]

      - name: Run unit tests (including simcodes tracking via docker)
        env:
          SIMBA_TEST_SIMCODES: "1"
        run: pytest unit_tests/ -v
