# Attributes OPAL's DISTRIBUTION command actually accepts, taken from the
# attribute enum in the installed OPAL's Distribution/Distribution.h. The
# `disallowed` blacklist above cannot keep up with every generic generator
# attribute, so the writer filters against this whitelist instead: anything not
# listed here is silently dropped rather than emitted and rejected by OPAL.
allowed:
  - TYPE
  - FNAME
  - WRITETOFILE
  - WEIGHT
  - INPUTMOUNITS
  - EMITTED
  - EMISSIONSTEPS
  - EMISSIONMODEL
  - EKIN
  - ELASER
  - FE
  - CATHTEMP
