# OPTION lines of the deck (OPAL.option_settings), overridden by global settings.
option:
  # Steps between phase-space dumps of the whole bunch to <section>.h5 (300 kB a dump for 4096
  # particles: a few GB for a linac). The largest value OPAL takes means never; it still writes
  # the last step, and the monitor files (the beam at each screen and BPM) and the .stat file are
  # not affected. A smaller value gives the emittances and dispersion at every dump (postProcess).
  PSDUMPFREQ: 2147483647
  STATDUMPFREQ: 10
  BOUNDPDESTROYFQ: 10
  COMPUTEPERCENTILES: False
  AUTOPHASE: 6
  VERSION: "202210"
track:
  MAXSTEPS: 1000000000
  DT: 2e-12
fieldsolver:
  PARFFTX: True
  PARFFTY: True
  PARFFTT: True
  BCFFTX: open
  BCFFTY: open
  BCFFTT: open
  BBOXINCR: 4
  GREENSF: Integrated
  FSTYPE: FFT
distribution:
  EMISSIONSTEPS: 500
  NBIN: 10
  EMISSIONMODEL: ASTRA
global:
  MINSTEPFORREBIN: 500
  MINBINEMITTED: 100
