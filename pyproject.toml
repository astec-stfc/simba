[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "simba-accelerator"
description = "A python framework for particle accelerator simulations"
readme = "README.md"
dynamic = ["version"]
authors = [
    {name = "James Jones", email = "james.jones@stfc.ac.uk"},
]
license = "GPL-3.0-or-later"
maintainers = [
    {name = "James Jones", email = "james.jones@stfc.ac.uk"},
    {name = "Alex Brynes", email = "alexander.brynes@stfc.ac.uk"},
    {name = "Mark Johnson", email = "mark.johnson@stfc.ac.uk"},
]
dependencies = [
    "deepdiff>=8.6",
    "h5py>=2.10",
    "munch>=2.5",
    "numpy>=2",
    "tqdm>=4",
    "PyQt5>=5.1",
    "PyYAML>=5.3",
    "mpl-axes-aligner>=1.1",
    "lox>=0.11",
    "fastKDE>=2.1.5",
    "pydantic>=2.5.3",
    "attrs>=23.2.0",
    "ocelot-desy==25.06.0",
    "scipy>=1.5",
    "soliday.sdds",
    "easygdf>=2.1.1",
    "xsuite>=0.39.0",
    "paramiko",
    "deap",
    "pyqtgraph",
    "numba",
    "pyfftw",
    "numexpr",
    "cheetah-accelerator>=0.7.5",
    "openpmd-beamphysics>=0.10",
    "xopt",
    "Wake-T>=0.8.0",
    "laura-accelerator",
]

requires-python = ">= 3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
#    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.optional-dependencies]

test = [
    "pytest",
    "pytest-cov",
]

lint = [
    "ruff>=0.6",
    "libcst>=1.4",
]

docs = [
    "sphinx>=8",
    "sphinx-rtd-theme",
    "myst-nb",
    "sphinx_autodoc_typehints>=3",
    "sphinxcontrib-bibtex",
]

[tool.setuptools_scm]
version_scheme = "post-release"   # valid built-in scheme
local_scheme = "no-local-version" # removes +untagged suffix


[project.urls]
Homepage = "https://github.com/astec-stfc/simba"
Repository = "https://github.com/astec-stfc/simba.git"
Issues = "https://github.com/astec-stfc/simba/-/issues/"


[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"mypackage" = ["**/*.yaml"]

[tool.ruff]
target-version = "py310"
extend-exclude = [
    "build",
]

[tool.ruff.lint]
select = ["N"]  # pep8-naming only

[tool.ruff.lint.per-file-ignores]
"simba/_compat.py" = ["N801", "N802", "N803", "N806", "N807", "N815", "N816"]
"simba/**/_compat*.py" = ["N801", "N802", "N803", "N806", "N807", "N815", "N816"]
"simba/modules/symmlinks.py" = ["N801"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "pydantic.field_validator",
    "pydantic.model_validator",
    "field_validator",
    "model_validator",
]
extend-ignore-names = [
    "emass_eV",               # electron rest mass, in eV
    "emass_MeV",               # electron rest mass, in MeV
    "emass_GeV",               # electron rest mass, in GeV
    "particle_rest_energy_eV", # rest energy, in eV
    "E0_eV",                   # reference energy, in eV
    "sigma_cp_eV",             # momentum spread, in eV
]
